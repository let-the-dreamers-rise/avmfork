name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # daily differential run against MainNet
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install autotools for libsodium
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - name: Cache go-algorand checkout and libsodium
        uses: actions/cache@v4
        with:
          path: third_party
          key: go-algorand-${{ hashFiles('Makefile') }}
      - run: make deps
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: make vet
      - run: make test
      - run: make build
      - name: End-to-end tests against a MainNet fork
        run: make e2e

  difftest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - uses: actions/cache@v4
        with:
          path: third_party
          key: go-algorand-${{ hashFiles('Makefile') }}
      - run: make build
      - name: Replay recent MainNet groups on avmfork and on a MainNet node
        run: ./bin/avmfork-difftest -blocks 30 -per-block 0 -out difftest-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difftest-${{ github.run_id }}
          path: difftest-out
