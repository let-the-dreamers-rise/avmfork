name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # daily differential run against MainNet
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install autotools for libsodium
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - name: Cache go-algorand checkout and libsodium
        uses: actions/cache@v4
        with:
          path: third_party
          key: go-algorand-${{ hashFiles('Makefile') }}
      - run: make deps
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: make vet
      - run: make test
      - run: make build
      - name: End-to-end tests against a MainNet fork
        run: make e2e

  difftest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - uses: actions/cache@v4
        with:
          path: third_party
          key: go-algorand-${{ hashFiles('Makefile') }}
      - run: make build
      - name: Replay recent MainNet groups on avmfork and on a MainNet node
        run: ./bin/avmfork-difftest -blocks 30 -per-block 0 -out difftest-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difftest-${{ github.run_id }}
          path: difftest-out

  compat:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - uses: actions/cache@v4
        with:
          path: third_party
          key: go-algorand-${{ hashFiles('Makefile') }}
      - run: make build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start a MainNet fork
        run: |
          ./bin/avmfork --fork mainnet > avmfork.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:4002/health && break; sleep 1; done
          cat avmfork.log
      - name: py-algorand-sdk against the fork
        run: |
          pip install -r compat/requirements.txt
          python compat/check.py http://127.0.0.1:4002 https://mainnet-api.algonode.cloud
      - name: algosdk (JavaScript) against the fork
        run: |
          cd compat && npm install --no-audit --no-fund
          node check.mjs http://127.0.0.1:4002 https://mainnet-api.algonode.cloud
